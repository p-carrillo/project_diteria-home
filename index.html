<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diteria - Portfolio and projects hub by Pablo Carrillo. Explore projects, templates and technical challenges in software development.">
    <meta name="keywords" content="Diteria, Pablo Carrillo, portfolio, projects, development, templates, GitHub, software engineer">
    <meta name="author" content="Pablo Carrillo">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="language" content="es">
    
    <!-- Open Graph for social media -->
    <meta property="og:title" content="Diteria - Pablo Carrillo's Portfolio">
    <meta property="og:description" content="Projects hub and professional development portfolio">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pablocarrillo.net">
    <meta property="og:image" content="images/Diteria_logo.png">
    <meta property="og:site_name" content="Diteria">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Diteria">
    <meta name="twitter:description" content="Pablo Carrillo's portfolio and projects">
    <meta name="twitter:image" content="images/Diteria_logo.png">
    
    <!-- Additional SEO -->
    <meta name="rating" content="general">
    <meta name="revisit-after" content="7 days">
    
    <title>Diteria - Development Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="canonical" href="https://pablocarrillo.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <div class="hub-container">
            <div class="logo-section">
                <img src="images/Diteria_logo.png" alt="Diteria Logo" class="logo">
                <h1 class="brand-name">DITERIA</h1>
            </div>

            <div class="projects-section">
                <p class="projects-list"><strong>Projects</strong>:
                    <span
                        id="projects-list-content"
                        class="projects-list-content loading-text"
                        data-repo-section="projects"
                        aria-live="polite"
                    >Loading...</span>
                </p>
                <p class="projects-list"><strong>Templates</strong>:
                    <span
                        id="templates-list-content"
                        class="projects-list-content loading-text"
                        data-repo-section="templates"
                        aria-live="polite"
                    >Loading...</span>
                </p>
                <p class="projects-list"><strong>Technical tests</strong>:
                    <span
                        id="technical-tests-list-content"
                        class="projects-list-content loading-text"
                        data-repo-section="technical-tests"
                        aria-live="polite"
                    >Loading...</span>
                </p>
            </div>
        </div>
    </main>

    <footer class="signature">
        <p>by <a href="https://pablocarrillo.net" target="_blank" rel="noopener noreferrer">Pablo Carrillo</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
